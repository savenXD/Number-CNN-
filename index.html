<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MNIST CNN Classifier — Handwritten Digit Predictor</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="h-full bg-grid-pattern relative min-h-screen flex flex-col justify-between items-center text-neutral-900 selection:bg-black selection:text-white px-4 py-8 sm:py-12">

  <div class="w-full max-w-md mx-auto flex flex-col items-center gap-6">
    
    <!-- Header -->
    <header class="flex flex-col items-center text-center gap-2.5 w-full">
      <!-- Minimal Read Docs Pill Badge -->
      <a href="docs.html" target="_blank" class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-neutral-100 border border-neutral-200 text-[11px] font-mono tracking-wider text-neutral-800 hover:bg-neutral-900 hover:text-white transition-all shadow-sm group">
        <span class="w-1.5 h-1.5 rounded-full bg-black group-hover:bg-white animate-pulse"></span>
        <span class="font-bold">Read Docs</span>
        <svg class="w-3 h-3 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
        </svg>
      </a>
      
      <!-- Main Heading: MNIST CNN Classifier -->
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-black font-mono">
        MNIST CNN Classifier
      </h1>
    </header>

    <!-- Main Workspace -->
    <main class="w-full flex flex-col items-center gap-6">

      <!-- Canvas Container -->
      <div class="relative w-full max-w-[320px] sm:max-w-[360px] aspect-square rounded-2xl p-2 bg-white shadow-sm border border-neutral-300 transition-all duration-300">
        
        <!-- Canvas Floating Top Toolbar (Reset & Pencil SVG Tool Buttons) -->
        <div class="absolute top-3 right-3 z-30 flex items-center gap-1 bg-white p-1 rounded-lg border border-neutral-200 shadow-sm">
          <!-- Reset Button -->
          <button id="undoBtn" class="p-1.5 rounded text-neutral-600 hover:text-black hover:bg-neutral-100 transition-all" title="Clear Everything">
            <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
            </svg>
          </button>
          
          <!-- Pencil Draw Tool Button -->
          <button id="penBtn" class="p-1.5 rounded text-black bg-neutral-100 hover:bg-neutral-200 transition-all active:scale-95" title="Draw / Pencil Tool">
            <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
              <path d="m15 5 4 4"/>
            </svg>
          </button>
        </div>

        <!-- Faded Handwritten Prompt Overlay for Empty Canvas -->
        <div id="canvasPrompt" class="absolute inset-0 z-0 flex flex-col items-center justify-center gap-3 text-neutral-400/80 pointer-events-none select-none transition-opacity duration-300">
          <svg class="w-9 h-9 text-neutral-400 opacity-60 animate-pulse pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
            <path d="m15 5 4 4"/>
          </svg>
          <span class="font-handwritten text-2xl tracking-wide text-neutral-400/90 font-medium pointer-events-none select-none">Draw a number</span>
        </div>

        <!-- Canvas HTML5 Element -->
        <canvas id="digitCanvas" class="w-full h-full bg-white rounded-xl border border-neutral-200 relative z-10" style="touch-action: none; -webkit-user-select: none; user-select: none;"></canvas>

        <!-- Floating Submit SVG Button -->
        <div class="absolute bottom-3 right-3 z-30">
          <button id="predictBtn" class="w-10 h-10 bg-black hover:bg-neutral-800 text-white rounded-xl shadow flex items-center justify-center transition-all duration-200 active:scale-90 border border-black" title="Run Prediction">
            <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
            </svg>
          </button>
        </div>

        <!-- Minimal Loader Overlay -->
        <div id="loaderOverlay" class="absolute inset-0 z-40 bg-white rounded-2xl flex flex-col items-center justify-center gap-2 transition-all duration-500">
          <div class="w-6 h-6 border-2 border-neutral-300 border-t-black rounded-full animate-spin"></div>
          <span class="text-[10px] font-mono tracking-widest text-neutral-500 uppercase">Loading Model</span>
        </div>

      </div>

      <!-- Prediction Output Container (Black & White Minimal Theme) -->
      <div id="resultCard" class="w-full max-w-[320px] sm:max-w-[360px] bg-white border border-neutral-300 rounded-2xl p-5 shadow-sm">
        
        <!-- Big Predicted Digit at the Top -->
        <div class="flex flex-col items-center justify-center border-b border-neutral-200 pb-4 mb-4">
          <span class="text-[10px] font-mono tracking-widest text-neutral-400 uppercase mb-1">PREDICTED DIGIT</span>
          <div id="digitTicker" class="text-7xl font-bold font-mono text-black tracking-tight">
            -
          </div>
          <div class="mt-2 flex items-center gap-2 text-xs font-mono text-neutral-500">
            <span>Score: <strong id="topScoreText" class="text-black font-semibold">0.000000</strong></span>
            <span>&bull;</span>
            <span id="backendStatusBadge" class="text-neutral-600">Standby</span>
          </div>
        </div>

        <!-- 0 to 9 Digits Probability List with Clean Unwrapped Table Headers -->
        <div>
          <div class="flex items-center justify-between text-[10px] font-mono font-bold text-neutral-400 border-b border-neutral-200 pb-2 mb-2 px-1 uppercase tracking-wider whitespace-nowrap">
            <span class="w-6 text-left">Digit</span>
            <span class="flex-1 text-center font-medium">Probability Bar</span>
            <span class="w-24 text-right whitespace-nowrap font-medium">Raw Count</span>
          </div>
          
          <div id="probabilityList" class="flex flex-col gap-1.5 font-mono text-xs">
            <!-- Dynamically populated for Digits 0 through 9 -->
          </div>
        </div>

      </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-[10px] font-mono text-neutral-400">
      FastAPI Backend &bull; Keras CNN MNIST Model &bull; Black & White UI
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
